packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency install scripts by default, and requires an explicit
# decision on each one. That is a good default: a postinstall script is arbitrary
# code from a package you may not have audited.
#
# esbuild needs its script to link the correct platform binary. The other two are
# optional native speedups we do not need, so they stay unbuilt.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  workerd: false
